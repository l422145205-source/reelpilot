[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reelpilot"
version = "0.5.0"
description = "Time-grounded multimodal retrieval and recoverable video-editing agent"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "requests>=2.32,<3", "Pillow>=10", "av>=14", "imageio-ffmpeg>=0.6"]

[project.optional-dependencies]
mcp = ["mcp>=2.2.0,<3"]
models = ["torch>=2.8", "transformers>=4.57,<5", "accelerate>=1", "faster-whisper>=1.2", "sentencepiece>=0.2", "lm-format-enforcer>=0.11.3,<0.12"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.12"]

[project.scripts]
reelpilot = "reelpilot.cli:main"
reelpilot-mcp = "reelpilot.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reelpilot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

